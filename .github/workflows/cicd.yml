name: DevOps VLE 5 CI/CD

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: |
          docker build -t devops-lab-app ./app

      - name: Check Kubernetes Files
        run: |
          ls -la k8s
          cat k8s/deployment.yml
          cat k8s/service.yml

      - name: Kubernetes Deployment Ready
        run: |
          echo "Kubernetes configuration verified successfully."
          echo "Local Minikube deployment was tested separately."